services:
  app:
    image: ${APP_IMAGE:-abuse-reporter:narasi-v1}
    container_name: abuse-reporter
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:?Set server-only APP_ENV_FILE}
    extra_hosts:
      - "narasiahli.qudo.id:${NARASIAHLI_IP:-host-gateway}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3040:3040"
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3040/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  app-data:
    name: abuse-reporter-data
